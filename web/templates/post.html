{{ define "content" }}
<div class="min-h-screen" data-page="post" data-post-slug="{{ .Post.Slug }}">
  {{ template "nav" . }}

  <main class="px-6 lg:px-16 pb-24">
    <article class="max-w-3xl">
      <div class="flex flex-wrap gap-2 text-xs uppercase tracking-wide text-slate-500" id="post-tags">
        {{ range .Tags }}<span class="px-2 py-1 rounded-full border border-slate-200">{{ .Name }}</span>{{ end }}
      </div>
      <h1 class="mt-4 font-display text-3xl lg:text-5xl text-ink">{{ .Post.Title }}</h1>
      <p class="mt-3 text-slate-600">{{ .Post.Excerpt }}</p>
      <div class="mt-4 flex items-center gap-3">
        <button id="share-button" class="h-10 w-10 rounded-full border border-slate-200 text-slate-600 flex items-center justify-center" aria-label="Share">
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <path d="M8.59 13.51l6.83 3.98"></path>
            <path d="M15.41 6.51l-6.82 3.98"></path>
          </svg>
          <span class="sr-only">Share</span>
        </button>
      </div>
      <div class="mt-6 prose max-w-none" id="post-body">
        {{ .ContentHTML }}
      </div>
    </article>
  </main>
</div>
{{ end }}
