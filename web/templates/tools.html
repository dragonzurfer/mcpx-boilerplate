{{ define "content" }}
<div class="min-h-screen" data-page="tools">
  {{ template "nav" . }}

  <main class="px-6 lg:px-16 pb-24">
    <section class="max-w-3xl">
      <p class="text-skyline uppercase tracking-[0.3em] text-xs">Tools</p>
      <h1 class="mt-4 font-display text-4xl lg:text-6xl text-ink">Actionable tools for real career decisions.</h1>
      <p class="mt-4 text-slate-600 text-lg">Use guided copilots to plan, improve, and ship your next move with clarity.</p>
    </section>

    <div id="tools-loader" class="mt-10 flex justify-center items-center h-48">
      <div class="animate-spin rounded-full h-12 w-12 border-4 border-primary border-t-transparent"></div>
      <p class="ml-4 text-lg text-slate-600">Loading tools...</p>
    </div>
    <section class="mt-10 grid gap-6 md:grid-cols-2 xl:grid-cols-3 hidden" id="tools-grid" hidden></section>
  </main>
</div>
{{ end }}
