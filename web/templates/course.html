{{ define "content" }}
<div class="min-h-screen reader-page" data-page="course" data-course-slug="{{ .Course.Slug }}">
  {{ template "nav" . }}

  <main class="reader-main px-6 lg:px-16 pb-24">
    <section class="reader-hero max-w-4xl">
      <h1 class="font-display text-4xl lg:text-6xl text-ink" id="course-title">{{ .Course.Title }}</h1>
      <p class="mt-4 text-slate-600" id="course-description">{{ .Course.Excerpt }}</p>
    </section>

    <section class="course-reader-grid mt-10 grid gap-6">
      <aside class="course-roadmap rounded-3xl border border-slate-200 bg-white/85 p-5 h-fit lg:sticky lg:top-24">
        <div class="flex items-center justify-between gap-3">
          <p class="text-xs uppercase tracking-wide text-slate-500">Course roadmap</p>
          <span class="text-xs text-slate-500" id="course-roadmap-meta">0 lessons</span>
        </div>
        <div class="mt-4 space-y-3" id="course-modules-sidebar"></div>
      </aside>

      <article class="course-lesson-shell rounded-3xl border border-slate-200 bg-white/90 p-6 lg:p-8">
        <div id="course-promo-slot" class="mb-5 hidden"></div>
        <div class="course-lesson-header mb-8 border-b border-slate-100 pb-5">
          <p class="text-xs uppercase tracking-wide text-slate-500" id="course-lesson-meta">Select a lesson</p>
          <h2 class="mt-2 font-display text-2xl text-ink" id="course-lesson-title">Lesson content</h2>
        </div>
        <section class="prose medium-prose" id="course-body">
          {{ .ContentHTML }}
        </section>
      </article>

      <aside class="course-toc-shell hidden xl:block" id="course-toc-shell">
        <p class="course-toc-kicker">Table of contents</p>
        <nav class="mt-4 space-y-1" id="course-toc" aria-label="Lesson sections"></nav>
      </aside>
    </section>
  </main>
</div>
{{ end }}
