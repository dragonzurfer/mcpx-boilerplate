{{ define "content" }}
<div class="min-h-screen" data-page="course" data-course-slug="{{ .Course.Slug }}">
  {{ template "nav" . }}

  <main class="px-6 lg:px-16 pb-24">
    <section class="max-w-4xl">
      <h1 class="font-display text-3xl lg:text-5xl text-ink" id="course-title">{{ .Course.Title }}</h1>
      <p class="mt-3 text-slate-600" id="course-description">{{ .Course.Excerpt }}</p>
    </section>

    <section class="mt-10 grid gap-6 lg:grid-cols-[320px_1fr]">
      <aside class="rounded-3xl border border-slate-200 bg-white/85 p-5 h-fit lg:sticky lg:top-6">
        <div class="flex items-center justify-between gap-3">
          <p class="text-xs uppercase tracking-wide text-slate-500">Course roadmap</p>
          <span class="text-xs text-slate-500" id="course-roadmap-meta">0 lessons</span>
        </div>
        <div class="mt-4 space-y-3" id="course-modules-sidebar"></div>
      </aside>

      <div class="rounded-3xl border border-slate-200 bg-white/90 p-6 lg:p-8">
        <div class="mb-5 border-b border-slate-100 pb-4">
          <p class="text-xs uppercase tracking-wide text-slate-500" id="course-lesson-meta">Select a lesson</p>
          <h2 class="mt-2 font-display text-2xl text-ink" id="course-lesson-title">Lesson content</h2>
        </div>
        <section class="prose max-w-none" id="course-body">
          {{ .ContentHTML }}
        </section>
      </div>
    </section>
  </main>
</div>
{{ end }}
