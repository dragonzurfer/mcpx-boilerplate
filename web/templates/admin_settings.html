{{ define "content" }}
<div class="min-h-screen" data-page="admin-settings">
  {{ template "nav" . }}

  <main class="px-6 lg:px-16 pb-24">
    <section class="max-w-4xl">
      <p class="text-xs uppercase tracking-[0.3em] text-slate-500">Settings</p>
      <h1 class="mt-3 font-display text-3xl lg:text-5xl text-ink">Site settings</h1>
      <p class="mt-4 text-slate-600 text-lg">Manage branding, SEO defaults, and verification tags.</p>
      <div class="mt-3 flex items-center gap-2 text-xs text-slate-500">
        <span class="inline-flex h-5 w-5 items-center justify-center rounded-full border border-slate-300 text-[10px]" title="Primary color updates UI accents. OG image defaults are used for social cards when a post has no custom image.">i</span>
        <p>Primary color updates UI accents. OG image defaults are used for social cards when a post has no custom image.</p>
      </div>
    </section>

    {{ template "admin_nav" . }}

    <div id="admin-settings-error" class="hidden mt-8 rounded-2xl border border-rose-500/40 bg-rose-500/10 p-4 text-rose-700"></div>

    <section class="mt-10 rounded-3xl border border-slate-200 bg-white/80 p-6">
      <form id="settings-form" class="grid gap-4 md:grid-cols-2">
        <div class="space-y-2">
          <label class="text-sm text-slate-600">Site name</label>
          <input id="settings-site-name" class="w-full rounded-2xl bg-white border border-slate-200 px-4 py-3 text-slate-700" />
        </div>
        <div class="space-y-2">
          <label class="text-sm text-slate-600">Site URL</label>
          <input id="settings-site-url" class="w-full rounded-2xl bg-white border border-slate-200 px-4 py-3 text-slate-700" />
        </div>
        <div class="space-y-2">
          <label class="text-sm text-slate-600">Primary color (hex)</label>
          <input id="settings-primary-color" class="w-full rounded-2xl bg-white border border-slate-200 px-4 py-3 text-slate-700" />
        </div>
        <div class="space-y-2">
          <label class="text-sm text-slate-600">Default OG image URL</label>
          <input id="settings-og-image" class="w-full rounded-2xl bg-white border border-slate-200 px-4 py-3 text-slate-700" />
        </div>
        <div class="space-y-2">
          <label class="text-sm text-slate-600">Twitter site</label>
          <input id="settings-twitter-site" class="w-full rounded-2xl bg-white border border-slate-200 px-4 py-3 text-slate-700" />
        </div>
        <div class="space-y-2">
          <label class="text-sm text-slate-600">Twitter creator</label>
          <input id="settings-twitter-creator" class="w-full rounded-2xl bg-white border border-slate-200 px-4 py-3 text-slate-700" />
        </div>
        <div class="space-y-2">
          <label class="text-sm text-slate-600">Google verification</label>
          <input id="settings-google" class="w-full rounded-2xl bg-white border border-slate-200 px-4 py-3 text-slate-700" />
        </div>
        <div class="space-y-2">
          <label class="text-sm text-slate-600">Bing verification</label>
          <input id="settings-bing" class="w-full rounded-2xl bg-white border border-slate-200 px-4 py-3 text-slate-700" />
        </div>
        <div class="space-y-2 md:col-span-2">
          <label class="text-sm text-slate-600">Pinterest verification</label>
          <input id="settings-pinterest" class="w-full rounded-2xl bg-white border border-slate-200 px-4 py-3 text-slate-700" />
        </div>
        <div class="md:col-span-2">
          <button type="submit" class="w-full rounded-full bg-primary text-white py-3 font-semibold">Save settings</button>
        </div>
      </form>
    </section>
  </main>
</div>
{{ end }}
